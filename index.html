<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#85200C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Menús MM">
  <title>Menús · Casa María Madre</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="barra">
      <button class="icono" id="btnAtras" aria-label="Atrás" hidden>
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="barra-titulo">
        <span class="casa" id="tituloCasa">Casa María Madre · Menús</span>
        <span class="vista" id="tituloVista"></span>
      </div>
    </header>
    <div id="aviso" class="aviso" hidden></div>
    <main id="vista"></main>
    <nav class="menu" id="menu">
      <button data-ir="panel"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="9" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="5.5" rx="1.5"/><rect x="13.5" y="11.5" width="7.5" height="9.5" rx="1.5"/><rect x="3" y="15" width="7.5" height="6" rx="1.5"/></svg><span>Panel</span></button>
      <button data-ir="eventos"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Eventos</span></button>
      <button data-ir="platos"><svg viewBox="0 0 24 24"><path d="M5 3v8a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V3M7 13v8M17 21V3c-2.5 1-4 3.5-4 7v3h4"/></svg><span>Platos</span></button>
      <button data-ir="compras"><svg viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2.5 3.5h3l2.4 12h11l2-8.5H6.6"/></svg><span>Compras</span></button>
      <button data-ir="mas"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg><span>Más</span></button>
    </nav>
  </div>
  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <script src="config.js"></script>
  <script src="alergenos.js"></script>
  <script src="datos-demo.js"></script>
  <script src="app.js"></script>
</body>
</html>
